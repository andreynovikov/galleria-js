name: galleria
services:
  app:
    container_name: nextjs-galleria
    image: galleria
    build:
      context: ./
      target: runner
      args:
        entity: galleria
      secrets:
        - env_local
      tags:
        - galleria
    volumes:
      - /var/run/postgresql:/var/run/postgresql
      - /photos:/photos
      - ./.docker/:/app/.docker/
    network_mode: bridge
    ports:
      - "127.0.0.1:3000:3000/tcp"
    env_file: .env.local
    environment:
      NODE_ENV: production
    # Time for graceful shutdown: in-flight requests and background album sync
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: syslog
      options:
        syslog-address: unixgram:///run/systemd/journal/dev-log
        tag: "{{.Name}}/{{.ID}}"

secrets:
  env_local:
    file: ./.env.local
